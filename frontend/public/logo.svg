<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="markGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flowTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Icon Mark (Squircle 120x120 centered at x=80, y=80) -->
  <g transform="translate(20, 20)">
    <rect width="120" height="120" rx="30" fill="url(#markBg)"/>
    <rect x="1" y="1" width="118" height="118" rx="29" fill="none" stroke="url(#markGloss)" stroke-width="2"/>
    
    <!-- Mini Mark Scale -->
    <g transform="translate(60, 60) scale(0.24)">
      <!-- Behind Flow Arc -->
      <path d="M -90 40 C -90 100 -40 135 25 135 C 75 135 110 110 130 85 C 138 75 132 60 118 60 C 110 60 102 65 95 72 C 80 88 56 102 25 102 C -18 102 -56 75 -56 35 C -56 -2 0 -25 35 -38 L 48 -43 C 98 -62 135 -90 135 -130" 
            fill="none" stroke="url(#accentGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

      <!-- Main "C" Ribbon -->
      <path d="M 68 -130 C -45 -130 -125 -65 -125 25 C -125 115 -45 150 45 150 C 95 150 130 130 142 115 C 148 107 142 96 132 96 C 122 96 114 102 105 109 C 88 122 68 128 42 128 C -22 128 -88 100 -88 25 C -88 -50 -25 -106 65 -106 C 96 -106 122 -95 138 -78 C 145 -70 156 -74 158 -84 C 160 -94 152 -105 140 -114 C 120 -124 95 -130 68 -130 Z" 
            fill="#ffffff"/>

      <!-- Rising Growth Arrow -->
      <g transform="translate(85, -85) rotate(-45)">
        <path d="M -12 28 L -12 -18 L -32 -18 L 0 -58 L 32 -18 L 12 -18 L 12 28 Z" fill="#ffffff"/>
      </g>

      <!-- Center Wealth Node -->
      <circle cx="10" cy="15" r="20" fill="#ffffff"/>
      <circle cx="10" cy="15" r="12" fill="url(#accentGlow)"/>
    </g>
  </g>

  <!-- Typography: CashFlow -->
  <g transform="translate(165, 96)">
    <!-- "Cash" in Crisp Slate/Dark text -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="currentColor"
          class="logo-brand-cash">Cash</text>
          
    <!-- "Flow" in Gradient Emerald-Teal -->
    <text x="156" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="url(#flowTextGrad)">Flow</text>
  </g>
  
  <!-- Subtle Tagline / Subtitle -->
  <text x="167" y="128" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="2.5" 
        text-transform="uppercase" 
        opacity="0.55" 
        fill="currentColor">Smart Income &amp; Expense</text>
</svg>