<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Top Gloss Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Main Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Accent Emerald/Teal Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Stroke / Rim Light -->
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="url(#glossGrad)" stroke-width="4"/>
  
  <!-- Subtle Top Light Reflection -->
  <path d="M 0 120 C 0 53.7 53.7 0 120 0 L 392 0 C 458.3 0 512 53.7 512 120 L 512 210 C 370 250 140 210 0 160 Z" fill="url(#glossGrad)" opacity="0.4"/>

  <!-- Logo Emblem: Geometric "C" + Rising Arrow Growth + Financial Flow -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Behind Flow Arc / Growth Wave -->
    <path d="M -90 40 C -90 100 -40 135 25 135 C 75 135 110 110 130 85 C 138 75 132 60 118 60 C 110 60 102 65 95 72 C 80 88 56 102 25 102 C -18 102 -56 75 -56 35 C -56 -2 0 -25 35 -38 L 48 -43 C 98 -62 135 -90 135 -130" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Main Dynamic "C" Ribbon -->
    <path d="M 68 -130 C -45 -130 -125 -65 -125 25 C -125 115 -45 150 45 150 C 95 150 130 130 142 115 C 148 107 142 96 132 96 C 122 96 114 102 105 109 C 88 122 68 128 42 128 C -22 128 -88 100 -88 25 C -88 -50 -25 -106 65 -106 C 96 -106 122 -95 138 -78 C 145 -70 156 -74 158 -84 C 160 -94 152 -105 140 -114 C 120 -124 95 -130 68 -130 Z" 
          fill="url(#ribbonGrad)" filter="url(#glow)"/>

    <!-- Dynamic Upward Growth Arrow (Fintech Trajectory) -->
    <g transform="translate(85, -85) rotate(-45)">
      <path d="M -12 28 L -12 -18 L -32 -18 L 0 -58 L 32 -18 L 12 -18 L 12 28 Z" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- Central Luminous Flow Node (Wealth / Security core) -->
    <circle cx="10" cy="15" r="22" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
    <circle cx="10" cy="15" r="14" fill="url(#accentGrad)"/>
    <circle cx="10" cy="15" r="6" fill="#ffffff"/>
  </g>
</svg>